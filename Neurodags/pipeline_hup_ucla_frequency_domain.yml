# Per-recording frequency-domain features directly from preprocessed FIF files.
# The dataset configuration is generated beside the frozen manifest; see
# scripts/features/build_hup_ucla_feature_manifest.py. Every run supplies it
# explicitly with -d, so this default is a name, not a checked-in file.
datasets: datasets_hup_ucla_frequency_domain.yml
mount_point: cluster
new_definitions:
  - custom_nodes_frequency_domain.py
n_jobs: 1

DerivativeDefinitions:
  FrequencyDomainFeatures:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: SourceFile
      - id: 1
        node: frequency_domain_features
        args:
          source_path: id.0
          channel_labels_csv: $channel_labels_csv
          task: $task
          recording_state: $recording_state

DerivativeList:
  - FrequencyDomainFeatures
