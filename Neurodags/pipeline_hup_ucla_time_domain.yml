# Per-recording temporal features from already preprocessed FIF files.
datasets: datasets_hup_ucla_time_domain.yml
mount_point: cluster
new_definitions:
  - custom_nodes_time_domain.py
n_jobs: 1

DerivativeDefinitions:
  TimeDomainFeatures:
    overwrite: False
    save: True
    for_dataframe: False
    nodes:
      - id: 0
        derivative: SourceFile
      - id: 1
        node: time_domain_features
        args:
          source_path: id.0
          channel_labels_csv: $channel_labels_csv
          task: $task
          recording_state: $recording_state

DerivativeList:
  - TimeDomainFeatures
